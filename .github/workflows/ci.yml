name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-latest
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # Opens a real window on a local server under a virtual display and
      # checks the launcher is still running (no crash) after a few seconds.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/site
          echo '<!doctype html><title>smoke</title><h1>ok</h1>' > /tmp/site/index.html
          python3 -m http.server 8765 --bind 127.0.0.1 -d /tmp/site &
          xvfb-run -a bash -c '
            ./target/release/porthole run --url 8765 & pid=$!
            sleep 5
            kill -0 $pid || { echo "porthole exited early"; exit 1; }
            kill $pid
          '

      # Starts the example sidecar app, checks the backend is up, then
      # SIGKILLs the launcher and checks the backend went with it.
      - name: Smoke test, sidecar (Linux)
        if: runner.os == 'Linux'
        env:
          PORTHOLE_NO_DIALOGS: '1'
        run: |
          xvfb-run -a bash -c '
            ./target/release/porthole run examples/hello-python/app.toml --console & pid=$!
            sleep 5
            kill -0 $pid || { echo "porthole exited early"; exit 1; }
            pgrep -x -f "python3 server.py" || { echo "backend is not running"; exit 1; }
            kill -9 $pid
            sleep 2
            if pgrep -x -f "python3 server.py"; then echo "backend outlived porthole"; exit 1; fi
          '

      # Packs both examples, checks `inspect`, and runs the packed sidecar
      # app (it must unpack, start its backend, and take the backend down
      # when killed) and the packed static app.
      - name: Smoke test, packed apps (Linux)
        if: runner.os == 'Linux'
        env:
          PORTHOLE_NO_DIALOGS: '1'
          PORTHOLE_CACHE_DIR: /tmp/porthole-cache
        run: |
          ./target/release/porthole pack examples/hello-python/app.toml -o /tmp/HelloPython
          ./target/release/porthole pack examples/hello-static/app.toml -o /tmp/HelloStatic
          ./target/release/porthole inspect /tmp/HelloPython | grep -q 'sha256.*(matches)'
          ./target/release/porthole inspect /tmp/HelloStatic | grep -q 'served from memory'
          xvfb-run -a bash -c '
            /tmp/HelloPython --console & pid=$!
            sleep 5
            kill -0 $pid || { echo "packed app exited early"; exit 1; }
            pgrep -x -f "python3 server.py" || { echo "backend is not running"; exit 1; }
            ls /tmp/porthole-cache/*/.complete || { echo "no cache folder"; exit 1; }
            kill -9 $pid
            sleep 2
            if pgrep -x -f "python3 server.py"; then echo "backend outlived porthole"; exit 1; fi
          '
          xvfb-run -a bash -c '
            /tmp/HelloStatic --console > /tmp/static.log 2>&1 & pid=$!
            sleep 5
            cat /tmp/static.log
            kill -0 $pid || { echo "packed static app exited early"; exit 1; }
            kill $pid
            grep -q "loaded .* files into memory" /tmp/static.log
            if grep -q "no file for" /tmp/static.log; then echo "a page asset 404ed"; exit 1; fi
          '

      # Launches the Express and FastAPI examples in a real webview and
      # checks the page's own API call gets through the auth handshake
      # (302, HttpOnly cookie, cookie sent on fetch).
      - name: Auth kit in a webview (Linux)
        if: runner.os == 'Linux'
        run: |
          # WebKitGTK sandboxes its web process with bubblewrap, which needs
          # unprivileged user namespaces; Ubuntu 24.04's AppArmor limits them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          (cd examples/hello-express && npm ci --install-links)
          # requirements.txt paths are relative to the folder pip runs in.
          (cd examples/hello-fastapi && python3 -m pip install --user --break-system-packages -r requirements.txt)
          xvfb-run -a auth-kit/webview-e2e.sh ./target/release/porthole examples/hello-express/app.toml dev.porthole.hello-express
          xvfb-run -a auth-kit/webview-e2e.sh ./target/release/porthole examples/hello-fastapi/app.toml dev.porthole.hello-fastapi

      - uses: actions/upload-artifact@v4
        with:
          name: porthole-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/porthole
            target/release/porthole.exe
          if-no-files-found: error

  # The auth kit's middlewares, on every OS: their own tests, then the
  # shared conformance checks against them and the three example backends.
  auth-kit:
    name: Auth kit (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: |
          (cd auth-kit/node && npm ci)
          (cd examples/hello-express && npm ci --install-links)
          python -m pip install -e 'auth-kit/python[test]'
          (cd examples/hello-fastapi && python -m pip install -r requirements.txt)

      - name: Node tests
        working-directory: auth-kit/node
        run: npm test

      - name: Python tests
        working-directory: auth-kit/python
        run: python -m pytest -q

      - name: Conformance
        run: |
          set -e
          c="python auth-kit/conformance.py --"
          $c node auth-kit/node/test/fixtures/express-server.js
          $c node auth-kit/node/test/fixtures/http-server.js
          $c python auth-kit/python/tests/fixtures/fastapi_server.py
          $c python auth-kit/python/tests/fixtures/starlette_server.py
          $c python examples/hello-python/server.py
          $c node examples/hello-express/server.js
          $c python examples/hello-fastapi/server.py
