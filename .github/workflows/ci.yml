name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-latest
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # Opens a real window on a local server under a virtual display and
      # checks the launcher is still running (no crash) after a few seconds.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/site
          echo '<!doctype html><title>smoke</title><h1>ok</h1>' > /tmp/site/index.html
          python3 -m http.server 8765 --bind 127.0.0.1 -d /tmp/site &
          xvfb-run -a bash -c '
            ./target/release/porthole run --url 8765 & pid=$!
            sleep 5
            kill -0 $pid || { echo "porthole exited early"; exit 1; }
            kill $pid
          '

      # Starts the example sidecar app, checks the backend is up, then
      # SIGKILLs the launcher and checks the backend went with it.
      - name: Smoke test, sidecar (Linux)
        if: runner.os == 'Linux'
        env:
          PORTHOLE_NO_DIALOGS: '1'
        run: |
          xvfb-run -a bash -c '
            ./target/release/porthole run examples/hello-python/app.toml --console & pid=$!
            sleep 5
            kill -0 $pid || { echo "porthole exited early"; exit 1; }
            pgrep -x -f "python3 server.py" || { echo "backend is not running"; exit 1; }
            kill -9 $pid
            sleep 2
            if pgrep -x -f "python3 server.py"; then echo "backend outlived porthole"; exit 1; fi
          '

      # Packs both examples, checks `inspect`, and runs the packed sidecar
      # app (it must unpack, start its backend, and take the backend down
      # when killed) and the packed static app.
      - name: Smoke test, packed apps (Linux)
        if: runner.os == 'Linux'
        env:
          PORTHOLE_NO_DIALOGS: '1'
          PORTHOLE_CACHE_DIR: /tmp/porthole-cache
        run: |
          ./target/release/porthole pack examples/hello-python/app.toml -o /tmp/HelloPython
          ./target/release/porthole pack examples/hello-static/app.toml -o /tmp/HelloStatic
          ./target/release/porthole inspect /tmp/HelloPython | grep -q 'sha256.*(matches)'
          ./target/release/porthole inspect /tmp/HelloStatic | grep -q 'served from memory'
          xvfb-run -a bash -c '
            /tmp/HelloPython --console & pid=$!
            sleep 5
            kill -0 $pid || { echo "packed app exited early"; exit 1; }
            pgrep -x -f "python3 server.py" || { echo "backend is not running"; exit 1; }
            ls /tmp/porthole-cache/*/.complete || { echo "no cache folder"; exit 1; }
            kill -9 $pid
            sleep 2
            if pgrep -x -f "python3 server.py"; then echo "backend outlived porthole"; exit 1; fi
          '
          xvfb-run -a bash -c '
            /tmp/HelloStatic --console > /tmp/static.log 2>&1 & pid=$!
            sleep 5
            cat /tmp/static.log
            kill -0 $pid || { echo "packed static app exited early"; exit 1; }
            kill $pid
            grep -q "loaded .* files into memory" /tmp/static.log
            if grep -q "no file for" /tmp/static.log; then echo "a page asset 404ed"; exit 1; fi
          '

      - uses: actions/upload-artifact@v4
        with:
          name: porthole-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/porthole
            target/release/porthole.exe
          if-no-files-found: error
