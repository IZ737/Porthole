name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS arm64
            os: macos-latest
          - name: Windows x64
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev xvfb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Build release
        run: cargo build --release --locked

      # Opens a real window on a local server under a virtual display and
      # checks the launcher is still running (no crash) after a few seconds.
      - name: Smoke test (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p /tmp/site
          echo '<!doctype html><title>smoke</title><h1>ok</h1>' > /tmp/site/index.html
          python3 -m http.server 8765 --bind 127.0.0.1 -d /tmp/site &
          xvfb-run -a bash -c '
            ./target/release/porthole run --url 8765 & pid=$!
            sleep 5
            kill -0 $pid || { echo "porthole exited early"; exit 1; }
            kill $pid
          '

      - uses: actions/upload-artifact@v4
        with:
          name: porthole-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/release/porthole
            target/release/porthole.exe
          if-no-files-found: error
