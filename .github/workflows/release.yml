name: Release

# Builds the launchers that `porthole pack --target` downloads, and
# publishes them on the GitHub release for the tag. Push a tag that matches
# Cargo.toml's version:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Run it by hand (workflow_dispatch) to build the assets without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    # A job whose runner never shows up should fail the release, not sit in
    # the queue for a day.
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: x86_64-pc-windows-msvc
            targets: x86_64-pc-windows-msvc
            os: windows-latest
          # Both Apple launchers come from one Apple Silicon runner: the
          # x86_64 one is cross-compiled. Hosted Intel macOS runners are
          # scarce and a job asking for a second macOS runner could queue
          # indefinitely.
          - name: apple-darwin
            targets: aarch64-apple-darwin x86_64-apple-darwin
            os: macos-latest
          # The oldest supported Ubuntu, so the launcher runs on distros
          # with an older glibc too.
          - name: x86_64-unknown-linux-gnu
            targets: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Rust targets
        id: targets
        run: echo "list=$(echo ${{ matrix.targets }} | tr ' ' ',')" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ steps.targets.outputs.list }}

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $ver"; exit 1
          fi

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: |
          for t in ${{ matrix.targets }}; do
            cargo build --release --locked --target "$t"
          done

      - name: Name the assets
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=.exe
          mkdir dist
          for t in ${{ matrix.targets }}; do
            cp "target/$t/release/porthole$ext" "dist/porthole-$ver-$t$ext"
          done
          ls -l dist
          if [ "${{ runner.os }}" = macOS ]; then file dist/*; fi

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          n=$(ls porthole-* | wc -l)
          [ "$n" -eq 4 ] || { echo "expected 4 launchers, got $n"; ls -l; exit 1; }
          sha256sum porthole-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Porthole ${GITHUB_REF_NAME#v}" \
            --notes "Install the CLI on macOS or Linux with \`curl -fsSL https://raw.githubusercontent.com/IZ737/Porthole/main/install.sh | sh\`, or on Windows with \`irm https://raw.githubusercontent.com/IZ737/Porthole/main/install.ps1 | iex\`. The same files are the launchers that \`porthole pack --target\` downloads."
