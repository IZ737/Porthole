name: Release

# Builds the launchers that `porthole pack --target` downloads, and
# publishes them on the GitHub release for the tag. Push a tag that matches
# Cargo.toml's version:
#
#   git tag v0.5.0 && git push origin v0.5.0
#
# Run it by hand (workflow_dispatch) to build the assets without publishing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # The oldest supported Ubuntu, so the launcher runs on distros
          # with an older glibc too.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install WebKitGTK
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$ver" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $ver"; exit 1
          fi

      - name: Build
        env:
          MACOSX_DEPLOYMENT_TARGET: '10.15'
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Name the asset
        run: |
          ver=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          ext=""; [ "${{ runner.os }}" = Windows ] && ext=.exe
          mkdir dist
          cp target/${{ matrix.target }}/release/porthole$ext dist/porthole-$ver-${{ matrix.target }}$ext
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: launcher-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: launcher-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum porthole-* > SHA256SUMS
          cat SHA256SUMS

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Porthole ${GITHUB_REF_NAME#v}" \
            --notes "Launchers for \`porthole pack --target\`. Install the CLI with \`cargo install porthole-cli\`, or use the launcher for your platform directly as \`porthole\`."
